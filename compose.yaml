services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/sqlite.db
    volumes:
      - ./data:/data
      - ./backend/logs:/app/logs
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
