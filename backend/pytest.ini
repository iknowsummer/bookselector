[pytest]
# テストディレクトリ
testpaths = tests

# Pythonパス（backendディレクトリ自体がルート）
# これにより、`from app.models import Book` のようなインポートが可能になる
pythonpath = .

# テストファイルのパターン
python_files = test_*.py

# テスト関数のパターン
python_functions = test_*

# テストクラスのパターン
python_classes = Test*

# 詳細な出力
addopts = -v --tb=short

# 警告フィルター
filterwarnings =
    ignore::RuntimeWarning
    ignore::DeprecationWarning

markers =
    unit: Unit tests
    integration: Integration tests